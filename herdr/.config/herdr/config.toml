# $HOME/.config/herdr/config.toml

# Run `herdr --default-config` to view all available options and their defaults.

onboarding = false

[terminal]
default_shell = "/bin/zsh"
shell_mode = "login"

[theme]
name = "tokyo-night"

[ui]
# Tabs
prompt_new_tab_name = false

[keys]
prefix = "ctrl+alt+cmd+shift+space"

# Zoom
zoom = ["ctrl+alt+cmd+shift+enter", "prefix+z"]

# Pane Navigation
focus_pane_left = ["cmd+h", "prefix+h"]
focus_pane_down = ["cmd+j", "prefix+j"]
focus_pane_up = ["cmd+k", "prefix+k"]
focus_pane_right = ["cmd+l", "prefix+l"]

# Split Panes
split_vertical = ["cmd+d", "prefix+v"]
split_horizontal = ["cmd+shift+d", "prefix+minus"]

# Tabs
new_tab = ["cmd+t", "prefix+c"]
previous_tab = ["cmd+shift+h", "prefix+p"]
next_tab = ["cmd+shift+l", "prefix+n"]
switch_tab = "cmd+alt+1..9"

# Workspace Navigation
previous_workspace = "cmd+shift+k"
next_workspace = "cmd+shift+j"
switch_workspace = "cmd+alt+shift+1..9"

# Agent Navigation
previous_agent = "ctrl+alt+shift+k"
next_agent = "ctrl+alt+shift+j"
focus_agent = "ctrl+alt+shift+1..9"
